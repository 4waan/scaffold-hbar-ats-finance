version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      workflow-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      hedera-protocol-dependencies:
        patterns:
          - "@hiero-ledger/*"
      javascript-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@hiero-ledger/*"
