[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
solc_version = "0.8.24"
# ATS v8 is compiled for Cancun. Forge must use the same execution rules when
# simulating calls into the pinned testnet Factory, or Cancun opcodes halt as
# NotActivated before any transaction can be broadcast.
evm_version = "cancun"
optimizer = true
optimizer_runs = 500
allow_paths = ["../../node_modules"]
fs_permissions = [
  { access = "read-write", path = "./deployments" }
]
remappings = [
  "@hiero-ledger/hiero-contracts/=../../node_modules/@hiero-ledger/hiero-contracts/"
]

[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 256, depth = 64, fail_on_revert = false }

[rpc_endpoints]
hedera_testnet = "${HEDERA_TESTNET_RPC_URL}"
