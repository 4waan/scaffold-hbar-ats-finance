schemaVersion: 2

name: judge-proof-experience
description: Build and validate the credential-free judge proof experience.
prd: .harness/prds/judge-proof-experience.md
agent: claude
maxAttempts: 2
skills:
  - hss-system-contract
  - quality-gates

baseline:
  commands:
    - name: install
      command: corepack yarn install --immutable
      timeoutMs: 600000
    - name: contracts
      command: yarn foundry:test
      timeoutMs: 600000
    - name: web-build
      command: yarn next:build
      timeoutMs: 600000

validators:
  static: .harness/validators/static.json
  commands: .harness/validators/yarn.json
  playwright: .harness/validators/playwright-smoke.yaml

contract: .harness/acceptance-contract.json
validator:
  enabled: true

constraints:
  packageManager: yarn@3.2.3
  workspaces:
    - packages/foundry
    - packages/nextjs
  forbiddenWorkspaces:
    - packages/hardhat

forbiddenFiles:
  - .env
  - packages/foundry/.env
  - packages/nextjs/.env.local

secretScan:
  failOnFiles:
    - .env
    - packages/foundry/.env
    - packages/nextjs/.env.local
  patterns:
    - name: private-key-assignment
      pattern: "(PRIVATE_KEY|OPERATOR_KEY|MNEMONIC)\\s*=\\s*(0x)?[0-9a-fA-F]{32,}"
    - name: pem-private-key
      pattern: "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY"

requiredFiles:
  - packages/nextjs/app/page.tsx
  - packages/nextjs/app/facility/page.tsx
  - packages/nextjs/app/verify/page.tsx
  - packages/foundry/deployments/reference-testnet.json
  - docs/hedera-integration-field-guide.md
